[package]
name = "campusbank-atm"
version = "0.1.0"
description = "University ATM Banking System built with Tauri and Rust"
authors = ["Student Project"]
edition = "2021"

[lib]
name = "campusbank_atm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }
argon2 = "0.5"
password-hash = "0.5"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
